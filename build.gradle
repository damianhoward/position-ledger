// The integration context: consumes orderbook's fill stream off Kafka, maintains positions in
// the Autonomous DB, reprices them through risk-engine, and publishes the result as JSON and an
// SSE stream. No front end — the screen that renders this lives on the trading desk. Matching
// and pricing are library dependencies (versioned releases on Maven Central), not code that lives here.
plugins {
    id 'com.damianhoward.kotlin-conventions' version '0.6.0'
    id 'application'
}

// Applied by id, not in the plugins block: the convention plugin puts the serialization compiler
// plugin on the build classpath at exactly its Kotlin version, but a single-module build's plugins
// block resolves ids before that classpath exists, and a version written here could drift from it.
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

group = 'com.damianhoward'
version = '1.0.0'

application {
    applicationName = 'position-ledger'
    mainClass = 'com.damianhoward.positionledger.MainKt'
}

dependencies {
    implementation 'com.damianhoward:orderbook:3.0.2'
    implementation 'com.damianhoward:risk-engine:2.0.1'
    implementation deps.kafka.clients
    implementation deps.flyway.core
    runtimeOnly deps.flyway.oracle
    runtimeOnly deps.oracle.jdbc
    // Reads the Autonomous DB's auto-login wallet (cwallet.sso) for mutual TLS.
    runtimeOnly deps.oracle.pki
    implementation deps.kotlinx.serialization.json
    // SLF4J for this service's own logging, which kafka-clients and Flyway already speak; Logback
    // writes it to stdout for journald, at the level logback.xml sets.
    implementation deps.slf4j.api
    runtimeOnly deps.logback.classic

    testImplementation deps.hamcrest
    // Real-broker and real-database integration tests; run in CI, skipped where Docker is absent.
    testImplementation deps.testcontainers.junit.jupiter
    testImplementation deps.testcontainers.kafka
    testImplementation deps.testcontainers.oracle.free
    testRuntimeOnly deps.oracle.jdbc
}

// Only the process entry point (MainKt — main() wires the real Kafka/DB/port and blocks) is
// excluded. The rest — consumer loop, retry/DLT, positions, persistence, risk adapter, web —
// is exercised by tests and counted.
coverageExcludes = ['**/positionledger/MainKt.class']